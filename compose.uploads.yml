# Combine with docker-compose.yml and compose.sandbox.yml.
services:
  backend:
    environment:
      AIDSO_MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      clamav:
        condition: service_healthy
  clamav:
    image: clamav/clamav@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
      - ./deploy/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    # No host port: the unauthenticated scanner is private to the compose network.
volumes:
  clamav_signatures:
