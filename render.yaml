services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI REST API)
  # ============================================================================
  - type: web
    name: aidso-backend-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET
        value: aidso-prod-storage
      - key: GEMINI_API_KEY
        sync: false

  # ============================================================================
  # 2. Background Training Worker
  # ============================================================================
  - type: worker
    name: aidso-training-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker/worker.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET
        value: aidso-prod-storage
      - key: GEMINI_API_KEY
        sync: false

  # ============================================================================
  # 3. Frontend Static Site (React / Vite)
  # ============================================================================
  - type: web
    name: aidso-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
